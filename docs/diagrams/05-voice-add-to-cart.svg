<rect width="1040" height="986" fill="#ffffff"/>
<text x="40" y="40" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#18181b">5 · Adding to the cart by voice</text>
<text x="40" y="66" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#52525b">Example: “Add 1 kg tomatoes and 2 kg potatoes”</text>
