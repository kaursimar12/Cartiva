<text x="56" y="424" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18181b">Quantity = number of PACKS</text>
<text x="56" y="444" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3f3f46">Tomato 1 kg pack: “1 kg” = 1 · Potato 1 kg pack: “2 kg” = 2</text>
<line x1="330.0" y1="456" x2="330.0" y2="494" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-52525b)"/>
<rect x="40" y="496" width="580" height="80" rx="12" fill="#fdf4ff" stroke="#c026d3" stroke-width="1.6"/>
<text x="56" y="524" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#18181b">add_to_cart(&quot;p001&quot;, 1) · add_to_cart(&quot;p004&quot;, 2)</text>
<text x="56" y="544" font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="13" fill="#3f3f46">also clears any pending checkout (the total changed)</text>
<text x="56" y="564" font-family="Consolas, ui-monospace, Menlo, monospace" font-size="12" fill="#c026d3">📄 backend/agent/worker.py</text>
<line x1="330.0" y1="576" x2="330.0" y2="614" stroke="#52525b" stroke-width="2" marker-end="url(#arrow-52525b)"/>
